<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review kit: link, QR, print, texts</title>
<style>
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f6f6f4; color: #111 }
  main { max-width: 980px; margin: 0 auto; padding: 16px }
  fieldset { border: 1px solid #ddd; background: #fff; border-radius: 10px; padding: 12px 14px; margin: 0 0 12px }
  label { display: block; margin: 6px 0 2px; font-weight: 600 }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px }
  .langs label { display: inline-block; font-weight: 400; margin-right: 12px }
  .langs input { width: auto }
  button { padding: 9px 14px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font: inherit; cursor: pointer; margin: 4px 6px 4px 0 }
  .out { display: grid; grid-template-columns: 260px 1fr; gap: 14px; align-items: start }
  .qr svg { width: 100%; height: auto; background: #fff }
  pre { white-space: pre-wrap; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 6px 0 }
  .warn { color: #b00020; font-weight: 600 }
  .hint { color: #555; font-size: 13px }
  @media (max-width: 700px) { .row, .out { grid-template-columns: 1fr } }
</style>
</head>
<body>
<main>
  <h1>Ссылка на отзыв, QR, печать, тексты</h1>
  <p class="hint">Работает без интернета. Ничего никуда не отправляется. Ссылку на отзыв проще всего взять в профиле компании в Google: кнопка «Попросить оставить отзыв» (Ask for reviews), или ввести Place ID.</p>
  <fieldset>
    <div class="row">
      <div><label for="name">Название фирмы</label><input id="name" value="Studio Beispiel"></div>
      <div><label for="niche">Ниша</label><select id="niche">
        <option>salon</option><option>cafe</option><option>shop</option><option>trades</option><option>fitness</option><option>clinic</option><option>cleaning</option><option>other</option></select></div>
      <div><label for="color">Цвет</label><input id="color" type="color" value="#1a73e8"></div>
    </div>
    <label for="link">Ссылка на отзыв (g.page/r/.../review) или Place ID</label>
    <input id="link" placeholder="https://g.page/r/.../review  или  ChIJ...">
    <div class="row">
      <div><label for="sig">Подпись</label><input id="sig" placeholder="Anna und Team"></div>
      <div><label for="tone">Обращение</label><select id="tone"><option value="formal">вы / Sie</option><option value="informal">ты / du</option></select></div>
      <div class="langs"><label>Языки</label>
        <label><input type="checkbox" value="de" checked> de</label><label><input type="checkbox" value="en"> en</label>
        <label><input type="checkbox" value="ru" checked> ru</label><label><input type="checkbox" value="uk"> uk</label></div>
    </div>
    <button id="go">Сделать</button>
  </fieldset>
  <div id="result"></div>
</main>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
