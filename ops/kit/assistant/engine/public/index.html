<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Team helper</title>
<style>
body{font:16px system-ui;margin:0;background:#f5f5f4;color:#111}
main{max-width:560px;margin:0 auto;padding:16px}
.q{display:flex;gap:8px}textarea{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc;min-height:48px}
button{font:inherit;border:0;border-radius:10px;background:#1f2937;color:#fff;padding:10px 14px}
.a{background:#fff;border-radius:12px;padding:12px;margin:12px 0;white-space:pre-wrap}.s{font-size:13px;color:#555;margin-top:6px}
.n{font-size:13px;color:#555}
</style>
</head>
<body><main>
<h1 id="h">Team helper</h1>
<p class="n" id="note"></p>
<div id="login"><input id="code" type="password" placeholder="Team code" style="font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc"> <button id="go">OK</button></div>
<form class="q" id="f" hidden><textarea id="q" maxlength="800"></textarea><button>?</button></form>
<div id="log"></div>
</main>
<script>
var L = (navigator.language || "de").slice(0, 2);
var T = {
  de: ["Fragen zu unseren Regeln und Preisen", "Antworten nur aus den Regeln des Chefs. Keine Kundendaten eingeben.", "Ihre Frage"],
  en: ["Questions about our rules and prices", "Answers only from the owner's rules. Do not type customer data.", "Your question"],
  ru: ["Вопросы о наших правилах и ценах", "Ответы только из правил руководителя. Не вводите данные клиентов.", "Ваш вопрос"],
  uk: ["Питання про наші правила та ціни", "Відповіді лише з правил керівника. Не вводьте дані клієнтів.", "Ваше питання"]
}[L] || null;
if (!T) T = ["Questions about our rules and prices", "Answers only from the owner's rules. Do not type customer data.", "Your question"];
document.getElementById("h").textContent = T[0];
document.getElementById("note").textContent = T[1] + " (Automatic AI helper.)";
document.getElementById("q").placeholder = T[2];
var code = localStorage.getItem("team-code");
function ready() { document.getElementById("login").hidden = true; document.getElementById("f").hidden = false; }
if (code) ready();
document.getElementById("go").onclick = function () { code = document.getElementById("code").value.trim(); localStorage.setItem("team-code", code); ready(); };
document.getElementById("f").onsubmit = function (e) {
  e.preventDefault();
  var q = document.getElementById("q").value.trim(); if (!q) return;
  var box = document.createElement("div"); box.className = "a"; box.textContent = q + "\n..."; document.getElementById("log").prepend(box);
  fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code, q: q }) })
    .then(function (r) { if (r.status === 401) { localStorage.removeItem("team-code"); location.reload(); } return r.json(); })
    .then(function (d) {
      box.textContent = q + "\n\n" + (d.answer || "...");
      if (d.sources && d.sources.length) { var s = document.createElement("div"); s.className = "s"; s.textContent = d.sources.join("; "); box.appendChild(s); }
    });
  document.getElementById("q").value = "";
};
</script>
</body></html>
