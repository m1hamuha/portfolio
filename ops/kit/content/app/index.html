<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1b18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Photo</title>
<style>
  :root { --bg: #1f1b18; --fg: #f6f1ec; --muted: #b9aea4; --acc: #e7b48f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); padding: 16px env(safe-area-inset-right) 32px env(safe-area-inset-left); }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  button, label.btn { display: block; width: 100%; padding: 14px; margin: 8px 0; border: 0; border-radius: 12px; background: var(--acc); color: #1f1b18; font-size: 17px; font-weight: 600; text-align: center; }
  button.sec { background: #3a332e; color: var(--fg); }
  button:disabled { opacity: .5; }
  input[type=file] { display: none; }
  input[type=text], textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #4a423c; background: #2a2420; color: var(--fg); font: inherit; }
  textarea { min-height: 120px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
  .grid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
  video { width: 100%; border-radius: 10px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="title">…</h1>
  <p id="msg" class="muted"></p>
  <section id="pick">
    <input id="note" type="text" maxlength="200">
    <label class="btn" for="files" id="pickLabel"></label>
    <input id="files" type="file" accept="image/*,video/*" multiple>
  </section>
  <section id="codeForm" hidden>
    <p id="codeLabel"></p>
    <input id="codeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="codeGo"></button>
  </section>
  <section id="result" hidden>
    <div id="grid" class="grid"></div>
    <textarea id="caption"></textarea>
    <button id="save"></button>
    <button id="copy" class="sec"></button>
    <button id="clip" class="sec"></button>
    <video id="clipView" controls playsinline hidden></video>
    <button id="saveClip" class="sec" hidden></button>
    <button id="again" class="sec"></button>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
